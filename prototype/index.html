<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MultiMarket</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--mut:#8e8e93;--line:#e5e5ea;--acc:#0a84ff;--ok:#30b350;--r1:#ff3b30;--r2:#ff9500;--r3:#8e8e93}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--line:#38383a}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,system-ui,sans-serif;padding-bottom:140px}
main{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:30px;margin:18px 0 10px}
h2{font-size:13px;text-transform:uppercase;color:var(--mut);margin:20px 4px 6px;display:flex;justify-content:space-between;letter-spacing:.03em}
.seg{display:flex;background:var(--line);border-radius:9px;padding:2px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:7px;font-size:14px;color:var(--tx)}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px #0002}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);flex:none;background:none;padding:0;color:#fff;font-size:14px}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.row.done .nm{text-decoration:line-through;color:var(--mut)}
.mid{flex:1;min-width:0}
.nm{font-weight:500}
.sub{font-size:13px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.u{width:9px;height:9px;border-radius:50%;flex:none}
.u1{background:var(--r1)}.u2{background:var(--r2)}.u3{background:var(--r3)}
.tag{background:var(--bg);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--tx);border:0}
.tag.btn{color:var(--acc)}
.pr{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.gh{display:flex;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);font-weight:600}
.gh small{color:var(--mut);font-weight:400}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar>div{max-width:560px;margin:auto}
.add{display:flex;gap:8px}
input[type=text],input[type=number],select{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
.go{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:0 16px;font-size:20px}
.tabs{display:flex;margin-top:8px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font-size:12px;padding:4px}
.tabs button.on{color:var(--acc);font-weight:600}
.tabs span{display:block;font-size:20px}
.sug{position:absolute;left:16px;right:16px;bottom:100%;background:var(--card);border-radius:12px;box-shadow:0 -4px 20px #0003;max-height:240px;overflow:auto;max-width:528px;margin:auto}
.sug div{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.sug small{color:var(--mut)}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:auto;border-radius:18px 18px 0 0;padding:16px;max-height:80vh;overflow:auto}
.opt{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-radius:12px;margin-bottom:8px;border:2px solid transparent;width:100%;color:var(--tx);text-align:left;font-size:16px}
.opt.rec{border-color:var(--ok)}
.opt.off{opacity:.45}
.opt .l{flex:1}
.badge{font-size:11px;background:var(--ok);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.sw{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;border:0}
.sw:checked{background:var(--ok)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.15s}
.sw:checked::after{left:20px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.star{border:0;background:none;font-size:20px;color:var(--mut);padding:0}.star.on{color:#ffcc00}
.note{font-size:13px;color:var(--mut);margin:6px 4px}
.sum{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:2px 4px 8px}
</style>
</head>
<body>
<main id="app"></main>
<div class="bar"><div style="position:relative">
  <div id="sug" class="sug" hidden></div>
  <form class="add" id="addf" autocomplete="off"><input type="text" id="q" placeholder="Añadir producto…"><button class="go" aria-label="Añadir">＋</button></form>
  <div class="tabs"><button data-t="lista"><span>🛒</span>Lista</button><button data-t="ajustes"><span>⚙️</span>Ajustes</button></div>
</div></div>
<div id="modal" class="modal" hidden></div>

<script>
// ---------- Datos de ejemplo (en producción vendrían de una API de precios/stock) ----------
const STORES=[
 {id:'mer',name:'Mercadona',chain:'Mercadona',km:0.4},
 {id:'dia',name:'Dia Centro',chain:'Dia',km:0.7},
 {id:'car',name:'Carrefour Express',chain:'Carrefour',km:1.2},
 {id:'lid',name:'Lidl',chain:'Lidl',km:2.1},
 {id:'ald',name:'Aldi',chain:'Aldi',km:3.0},
];
// price: precio por tienda (null = no lo tiene). out: sin stock. own: marca blanca exclusiva de esa tienda.
const P=(name,cold,prices,out=[],own=null)=>({name,cold,prices,out,own});
const CATALOG=[
 P('Leche entera 1L',1,{mer:.89,dia:.85,car:.95,lid:.79,ald:.82}),
 P('Leche Hacendado 1L',1,{mer:.86},[],'mer'),
 P('Leche Milbona 1L',1,{lid:.79},[],'lid'),
 P('Yogur natural x4',1,{mer:1.35,dia:1.29,car:1.45,lid:1.19,ald:1.25},['dia']),
 P('Queso lonchas',1,{mer:2.10,dia:2.25,car:2.40,lid:1.99}),
 P('Pechuga de pollo 1kg',1,{mer:6.90,dia:7.20,car:7.50,lid:6.49,ald:6.75}),
 P('Helado vainilla',1,{mer:2.95,car:3.40,lid:2.49},['lid']),
 P('Huevos docena',0,{mer:2.35,dia:2.40,car:2.60,lid:2.15,ald:2.20}),
 P('Plátanos 1kg',0,{mer:1.79,dia:1.99,car:1.89,lid:1.65}),
 P('Pan de molde',0,{mer:1.55,dia:1.49,car:1.75,lid:1.29,ald:1.35}),
 P('Arroz 1kg',0,{mer:1.35,dia:1.39,car:1.55,lid:1.19,ald:1.25}),
 P('Pasta Bosque Verde',0,{mer:.95},[],'mer'),
 P('Aceite de oliva 1L',0,{mer:8.90,dia:9.20,car:9.50,lid:8.49,ald:8.75}),
 P('Tomate frito',0,{mer:.99,dia:.95,car:1.10,lid:.89}),
 P('Atún en lata x3',0,{mer:3.10,dia:2.95,car:3.30,lid:2.85,ald:2.99}),
 P('Papel higiénico 12u',0,{mer:4.60,dia:4.35,car:5.20,lid:3.99,ald:4.10}),
 P('Detergente',0,{mer:5.90,dia:5.50,car:6.40,lid:4.99}),
 P('Yogur Carrefour Classic x4',1,{car:.99},[],'car'),
];
const URG=[{n:'Ya',c:'u1'},{n:'Pronto',c:'u2'},{n:'Sin prisa',c:'u3'}];

// ---------- Estado ----------
const load=()=>{try{return JSON.parse(localStorage.getItem('mm'))}catch{return null}};
let S=load()||{
  items:[],
  cfg:{enabled:{mer:1,dia:1,car:1,lid:0,ald:0},fav:{mer:1},maxKm:5,crit:'precio',auto:false},
  view:'compra',cold:'todo',tab:'lista'
};
const save=()=>{try{localStorage.setItem('mm',JSON.stringify(S))}catch{}};
const $=s=>document.querySelector(s);
const store=id=>STORES.find(s=>s.id===id);
const eur=n=>n.toFixed(2).replace('.',',')+' €';
const uid=()=>Math.random().toString(36).slice(2);

// ---------- Lógica de selección de súper ----------
const active=()=>STORES.filter(s=>S.cfg.enabled[s.id]&&s.km<=S.cfg.maxKm);
function options(prod){ // tiendas candidatas con precio/stock, ordenadas por criterio
  const st=prod.own?STORES.filter(s=>s.id===prod.own):active();
  const list=st.map(s=>({s,price:prod.prices[s.id]??null,out:prod.out.includes(s.id)}))
               .filter(o=>prod.own||o.price!==null);
  const avail=o=>o.out?1:0, fav=o=>S.cfg.fav[o.s.id]?0:1, p=o=>o.price??99;
  const key={precio:o=>[avail(o),p(o),o.s.km],distancia:o=>[avail(o),o.s.km,p(o)],preferencia:o=>[avail(o),fav(o),p(o),o.s.km]}[S.cfg.crit];
  return list.sort((a,b)=>{const x=key(a),y=key(b);for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]-y[i];return 0});
}
function addItem(name){
  name=name.trim();if(!name)return;
  const prod=CATALOG.find(p=>p.name.toLowerCase()===name.toLowerCase())
    ||{name,cold:/leche|yogur|queso|carne|pollo|pescado|helado|congelad|jamón/i.test(name)?1:0,prices:{},out:[],own:null,custom:1};
  const it={id:uid(),name:prod.name,cold:prod.cold,urg:2,done:false,store:null,price:null,custom:!!prod.custom};
  const opts=prod.custom?active().map(s=>({s,price:null,out:false})):options(prod);
  if(prod.own){ // marca blanca / exclusivo: asignación directa
    const o=opts[0];it.store=o.s.id;it.price=o.price;S.items.push(it);save();render();return}
  if(!opts.length){S.items.push(it);save();render();return}
  if(S.cfg.auto&&!prod.custom){const o=opts[0];it.store=o.s.id;it.price=o.price;S.items.push(it);save();render();return}
  S.items.push(it);save();render();pickStore(it.id,true);
}
function pickStore(id,isNew){
  const it=S.items.find(i=>i.id===id);
  const prod=CATALOG.find(p=>p.name===it.name)||{prices:{},out:[],own:null,custom:1};
  const opts=prod.custom?active().map(s=>({s,price:null,out:false})):options(prod);
  const cheapest=Math.min(...opts.filter(o=>o.price!==null&&!o.out).map(o=>o.price));
  const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="sheet"><h2 style="margin-top:0"><span>${it.name}</span><span>criterio: ${S.cfg.crit}</span></h2>
  ${opts.map((o,i)=>`<button class="opt ${i===0&&!o.out?'rec':''} ${o.out?'off':''}" data-s="${o.s.id}" ${o.out?'disabled':''}>
    <div class="l"><b>${o.s.name}</b>${i===0&&!o.out?'<span class="badge">recomendado</span>':''}<div class="sub">${o.s.km} km${S.cfg.fav[o.s.id]?' · ★ favorito':''}${o.out?' · sin stock':''}</div></div>
    <div class="pr">${o.price!==null?eur(o.price):'—'}${o.price===cheapest?' 💚':''}</div></button>`).join('')||'<p class="note">Activa algún súper en Ajustes.</p>'}
  <button class="opt" data-s="">Dejar sin asignar</button></div>`;
  m.onclick=e=>{
    const b=e.target.closest('.opt');
    if(b){const o=opts.find(o=>o.s.id===b.dataset.s);it.store=b.dataset.s||null;it.price=o?o.price:null;save();m.hidden=true;render()}
    else if(e.target===m){m.hidden=true;if(isNew){/* se queda sin asignar */}}
  };
}

// ---------- Vistas ----------
function visible(){
  return S.items.filter(i=>S.cold==='todo'||(S.cold==='frio'?i.cold:!i.cold))
    .sort((a,b)=>a.done-b.done||a.urg-b.urg||a.name.localeCompare(b.name));
}
function rowHtml(i,showStore){
  const st=i.store?store(i.store):null;
  return `<div class="row ${i.done?'done':''}" data-id="${i.id}">
    <button class="chk" data-a="done">${i.done?'✓':''}</button>
    <div class="mid"><div class="nm">${i.name}</div>
      <div class="sub"><span class="u ${URG[i.urg-1].c}"></span><button class="tag btn" data-a="urg">${URG[i.urg-1].n}</button>
      ${i.cold?'<span class="tag">❄️ frío</span>':''}
      ${showStore?`<button class="tag btn" data-a="store">${st?st.name:'Elegir súper'}</button>`:''}</div></div>
    <div class="pr">${i.price!==null?eur(i.price):''}</div>
    <button class="tag" data-a="del" style="color:var(--r1)">✕</button></div>`;
}
function renderLista(){
  const items=visible();
  let h=`<h1>MultiMarket</h1>
  <div class="seg"><button data-v="compra" class="${S.view==='compra'?'on':''}">Por compra</button><button data-v="tiendas" class="${S.view==='tiendas'?'on':''}">Por tienda</button></div>
  <div class="chips">${[['todo','Todo'],['frio','❄️ Solo fríos'],['seco','🧺 Sin refrigerar']].map(([k,l])=>`<button class="chip ${S.cold===k?'on':''}" data-c="${k}">${l}</button>`).join('')}</div>`;
  if(!items.length)return h+`<div class="empty">Nada por aquí.<br>Añade productos abajo 👇</div>`;
  const total=items.filter(i=>!i.done).reduce((t,i)=>t+(i.price||0),0);
  h+=`<div class="sum"><span>${items.filter(i=>!i.done).length} pendientes</span><span>Total est. ${eur(total)}</span></div>`;
  if(S.view==='compra'){
    h+='<div class="card">'+items.map(i=>rowHtml(i,true)).join('')+'</div>';
  }else{
    const groups={};items.forEach(i=>(groups[i.store||'_']??=[]).push(i));
    const score=g=>Math.min(...g.filter(i=>!i.done).map(i=>i.urg),9); // la tienda con lo más urgente va primero
    h+=Object.entries(groups).sort((a,b)=>score(a[1])-score(b[1])).map(([id,g])=>{
      const st=store(id),sub=g.filter(i=>!i.done).reduce((t,i)=>t+(i.price||0),0);
      return `<h2 style="margin-bottom:6px"><span></span></h2><div class="card"><div class="gh"><span>${st?st.name:'Sin asignar'} <small>${st?st.km+' km':''}</small></span><small>${eur(sub)}</small></div>${g.map(i=>rowHtml(i,true)).join('')}</div>`}).join('');
  }
  const done=S.items.filter(i=>i.done).length;
  if(done)h+=`<p style="text-align:center"><button class="chip" data-a="clear">Quitar ${done} comprados</button></p>`;
  return h;
}
function renderAjustes(){
  const c=S.cfg;
  return `<h1>Ajustes</h1>
  <h2><span>Mis supermercados</span></h2>
  <div class="card">${STORES.map(s=>`<div class="row"><div class="mid"><div class="nm">${s.name}</div><div class="sub">${s.chain} · ${s.km} km</div></div>
   <button class="star ${c.fav[s.id]?'on':''}" data-fav="${s.id}">★</button>
   <input type="checkbox" class="sw" data-en="${s.id}" ${c.enabled[s.id]?'checked':''}></div>`).join('')}</div>
  <p class="note">Activa los que quieras usar. ★ marca los favoritos.</p>
  <h2><span>Selección de súper</span></h2>
  <div class="card">
   <div class="row"><div class="mid">Priorizar por</div><select id="crit" style="flex:none">${['precio','distancia','preferencia'].map(k=>`<option ${c.crit===k?'selected':''}>${k}</option>`).join('')}</select></div>
   <div class="row"><div class="mid">Distancia máxima</div><input type="number" id="km" value="${c.maxKm}" min="0.5" step="0.5" style="flex:none;width:80px"> km</div>
   <div class="row"><div class="mid">Asignar automáticamente<div class="sub">Si no, te enseña los precios y eliges</div></div><input type="checkbox" class="sw" id="auto" ${c.auto?'checked':''}></div>
  </div>
  <p class="note">Los productos de marca blanca o exclusivos de una cadena se asignan siempre a esa tienda.</p>
  <p style="text-align:center"><button class="chip" data-a="reset">Borrar todos los datos</button></p>`;
}
function render(){
  $('#app').innerHTML=S.tab==='lista'?renderLista():renderAjustes();
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
}

// ---------- Eventos ----------
document.addEventListener('click',e=>{
  const t=e.target,d=t.dataset;
  if(t.closest('.tabs button')){S.tab=t.closest('.tabs button').dataset.t;save();render();return}
  if(d.v){S.view=d.v}else if(d.c){S.cold=d.c}
  else if(d.fav){S.cfg.fav[d.fav]=S.cfg.fav[d.fav]?0:1}
  else if(d.a){
    const it=S.items.find(i=>i.id===t.closest('.row')?.dataset.id);
    if(d.a==='done')it.done=!it.done;
    if(d.a==='urg')it.urg=it.urg%3+1;
    if(d.a==='del')S.items=S.items.filter(i=>i!==it);
    if(d.a==='store'){pickStore(it.id);return}
    if(d.a==='clear')S.items=S.items.filter(i=>!i.done);
    if(d.a==='reset'){if(!confirm('¿Borrar todo?'))return;try{localStorage.clear()}catch{}location.reload();return}
  }else return;
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.en)S.cfg.enabled[t.dataset.en]=t.checked?1:0;
  if(t.id==='crit')S.cfg.crit=t.value;
  if(t.id==='km')S.cfg.maxKm=+t.value||5;
  if(t.id==='auto')S.cfg.auto=t.checked;
  save();
});
$('#addf').onsubmit=e=>{e.preventDefault();const q=$('#q');S.tab='lista';addItem(q.value);q.value='';$('#sug').hidden=true};
$('#q').oninput=e=>{
  const v=e.target.value.toLowerCase(),s=$('#sug');
  const m=v?CATALOG.filter(p=>p.name.toLowerCase().includes(v)).slice(0,6):[];
  s.hidden=!m.length;
  s.innerHTML=m.map(p=>`<div data-n="${p.name}">${p.name}<small>${p.own?'exclusivo '+store(p.own).name:p.cold?'❄️':''}</small></div>`).join('');
};
$('#sug').onclick=e=>{const n=e.target.closest('[data-n]')?.dataset.n;if(n){$('#q').value='';$('#sug').hidden=true;S.tab='lista';addItem(n)}};
render();
</script>
</body>
</html>
